
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Padel Scorebord</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
    }
    .player-btn {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .action-btn {
      font-size: 1.1rem;
      margin: 8px 0;
    }
    .scoreboard-item {
      font-size: 1.1rem;
      padding: 8px 0;
      border-bottom: 1px solid #dee2e6;
    }
    .card {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container py-4">
  <h2 class="text-center mb-4 text-primary"><i class="bi bi-trophy-fill me-2"></i>Padel Scorebord</h2>

  <div class="card">
    <div class="card-header bg-light">
      <strong>Selecteer twee spelers:</strong>
    </div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-6"><button class="btn btn-outline-primary w-100 player-btn" onclick="selectPlayer('Dre')">Dre</button></div>
        <div class="col-6"><button class="btn btn-outline-primary w-100 player-btn" onclick="selectPlayer('Ben')">Ben</button></div>
        <div class="col-6"><button class="btn btn-outline-primary w-100 player-btn" onclick="selectPlayer('CP')">CP</button></div>
        <div class="col-6"><button class="btn btn-outline-primary w-100 player-btn" onclick="selectPlayer('Jokke')">Jokke</button></div>
        <div class="col-6"><button class="btn btn-outline-primary w-100 player-btn" onclick="selectPlayer('Swerts')">Swerts</button></div>
      </div>
      <div class="mt-3 text-info fw-bold" id="selected-players">Geselecteerde spelers: </div>
      <button class="btn btn-success action-btn w-100 mt-3" onclick="confirmWin()">
        ✅ Bevestig Winnaar
      </button>
      <button class="btn btn-warning action-btn w-100" onclick="undo()">
        ↩️ Ongedaan maken selectie
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-header bg-light">
      <strong>Individuele Scores:</strong>
    </div>
    <div class="card-body">
      <ul id="scoreboard" class="list-unstyled mb-0"></ul>
    </div>
  </div>
</div>

<script>
  let selectedPlayers = [];
  let scores = JSON.parse(localStorage.getItem('scores')) || {
    Dre: 0,
    Ben: 0,
    CP: 0,
    Jokke: 0,
    Swerts: 0
  };

  function selectPlayer(player) {
    if (selectedPlayers.length < 2 && !selectedPlayers.includes(player)) {
      selectedPlayers.push(player);
      document.getElementById('selected-players').innerText =
        'Geselecteerde spelers: ' + selectedPlayers.join(' en ');
    }
  }

  function confirmWin() {
    if (selectedPlayers.length === 2) {
      scores[selectedPlayers[0]] += 1;
      scores[selectedPlayers[1]] += 1;
      updateScoreboard();
      saveScores();
      selectedPlayers = [];
      document.getElementById('selected-players').innerText = 'Geselecteerde spelers: ';
    } else {
      alert("Selecteer twee spelers.");
    }
  }

  function undo() {
    selectedPlayers = [];
    document.getElementById('selected-players').innerText = 'Geselecteerde spelers: ';
  }

  function updateScoreboard() {
    const list = document.getElementById('scoreboard');
    list.innerHTML = '';
    for (let player in scores) {
      const li = document.createElement('li');
      li.className = 'scoreboard-item';
      li.innerHTML = `<i class="bi bi-person-fill me-2"></i>${player}: <strong>${scores[player]}</strong> punten`;
      list.appendChild(li);
    }
  }

  function saveScores() {
    localStorage.setItem('scores', JSON.stringify(scores));
  }

  updateScoreboard();
</script>

</body>
</html>
